<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4.0 Reconciliation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="mb-8 flex justify-between items-center bg-white p-6 rounded-lg shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Reconciliation Dashboard</h1>
                <p class="text-sm text-gray-500">M4.0 Real-time System Metrics</p>
            </div>
            <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-md transition text-sm">
                Refresh Metrics
            </button>
        </header>

        <!-- Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-8">
            <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-gray-500">
                <span class="text-xs text-gray-500 font-semibold uppercase">Total Requests</span>
                <p id="total-count" class="text-2xl font-bold text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-green-500">
                <span class="text-xs text-gray-500 font-semibold uppercase">Reconciled</span>
                <p id="reconciled-count" class="text-2xl font-bold text-green-600 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-yellow-500">
                <span class="text-xs text-gray-500 font-semibold uppercase">Processing</span>
                <p id="processing-count" class="text-2xl font-bold text-yellow-600 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-orange-500">
                <span class="text-xs text-gray-500 font-semibold uppercase">Stale Unmatched</span>
                <p id="stale-count" class="text-2xl font-bold text-orange-600 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-red-500">
                <span class="text-xs text-gray-500 font-semibold uppercase">Failed</span>
                <p id="failed-count" class="text-2xl font-bold text-red-600 mt-1">0</p>
            </div>
        </div>

        <!-- Dashboard Table -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-800">Recent Reconciliation Logs</h2>
                <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full font-medium">Live Feed</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-xs font-semibold text-gray-500 uppercase border-b border-gray-100">
                            <th class="p-4">Request ID</th>
                            <th class="p-4">Invoice #</th>
                            <th class="p-4">Doc Status</th>
                            <th class="p-4">Reconciliation State</th>
                            <th class="p-4">Created At</th>
                        </tr>
                    </thead>
                    <tbody id="dashboard-table-body" class="text-sm divide-y divide-gray-100">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-400">Loading live data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
